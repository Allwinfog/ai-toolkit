version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-toolkit-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    networks:
      - ai-toolkit

  mysql:
    image: mysql:8.0
    container_name: ai-toolkit-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ai_toolkit
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: ai_toolkit
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ai-toolkit

  redis:
    image: redis:7-alpine
    container_name: ai-toolkit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ai-toolkit

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai-toolkit-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      - mysql
    networks:
      - ai-toolkit

volumes:
  mysql_data:

networks:
  ai-toolkit:
    driver: bridge
